# .github/workflows/concordancia_d1.yml
# =====================================
# Velas diarias de D1 (TwelveData) y de Deriv, la muestra 1h de BTC, y la
# concordancia diaria con su compuerta (brief del Admin 14, 14b, punto 4).
#
# SOLO MANUAL: lo dispara el Admin, sin inputs. Sin `schedule:` (D8): la
# compuerta se corre cuando el Admin decide mirar, no sola.
#
# Escribe en la rama `data` con el patrón de velas_intradia.yml: checkout de
# `data` en ./data-store, SPEL_DRIVE_ROOT apuntando ahí, commit solo si hay
# cambios. COMPARTE EL GRUPO DE CONCURRENCY con los demás que escriben en
# `data`. Uno a la vez, sin cancelar.
#
# Deriv va por el canal PÚBLICO (/ws/public): sin cuenta, ni token, ni App
# ID. El único secreto es la key de TwelveData, y solo lo ve el paso que baja.
# Ese paso también pone al día el M5 del oro de las dos fuentes, después de
# las diarias, con velas_intradia (brief del Admin 15, punto 6).
# La concordancia lee lo que quedó en data-store después del commit: si el
# paso 1 se detiene, lo dice el informe, sin calcular la compuerta.
#
# INTERRUPTOR DE LA INGESTA (brief del Admin 16a, punto 5): los pasos que
# bajan velas y las commitean solo corren si la variable SPEL_INGESTA_CRUDA
# vale exactamente `true`. Si no está definida o vale otra cosa, la ingesta
# queda apagada y no se escriben velas crudas nuevas en `data`. Existe por
# las licencias: los Términos de TwelveData solo dejan redistribuir con un
# add-on o un acuerdo escrito, y los API Terms de Deriv no dejan guardar
# datos del feed más allá de una caché de 24 horas. La gobernanza de los
# datos crudos la decide el Admin (brief 20). La comparación se hace en bash,
# que es exacta, y no en un `if:`: según la documentación de GitHub, `==` de
# las expresiones de Actions no distingue mayúsculas (no verificado el
# 28-oct), y `TRUE` no tiene que encenderla.

name: SPEL concordancia diaria D1

on:
  workflow_dispatch: {}

concurrency:
  group: gdelt-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  concordancia_d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SPEL_DRIVE_ROOT: ${{ github.workspace }}/data-store
    steps:
      - uses: actions/checkout@v5

      - name: Checkout de la rama data
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-store
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Interruptor de la ingesta
        id: interruptor
        env:
          SPEL_INGESTA_CRUDA: ${{ vars.SPEL_INGESTA_CRUDA }}
        run: |
          if [ "${SPEL_INGESTA_CRUDA-}" = "true" ]; then
            echo "ingesta=encendida" >> "$GITHUB_OUTPUT"
            echo "SPEL_INGESTA_CRUDA vale exactamente true: se bajan velas y se commitean en data."
          else
            echo "ingesta=apagada" >> "$GITHUB_OUTPUT"
            echo "SPEL_INGESTA_CRUDA no vale exactamente true: no se bajan ni se commitean velas."
          fi

      # La key entra por `env:` de ESTE paso y nunca como argumento. Publica
      # los créditos estimados, los de D1 y los del M5 del oro, antes del
      # primer pedido. `continue-on-error`:
      # una descarga incompleta o una vela inválida sale 1 DESPUÉS de escribir
      # lo válido; se commitea y el job se pone rojo al final.
      - name: Velas diarias de D1 (escribe en data-store)
        id: velas
        if: steps.interruptor.outputs.ingesta == 'encendida'
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python ingestion/velas_d1.py --write

      - name: Commit a data
        if: steps.interruptor.outputs.ingesta == 'encendida'
        working-directory: data-store
        run: |
          git add -A metrics/velas
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "velas diarias de D1 $(date -u +%F)" \
            -m "Corrida ${{ github.run_id }} de ${{ github.workflow }} (${{ github.event_name }})."
          for intento in 1 2; do
            git pull --rebase -q origin data && git push -q origin HEAD:data && exit 0
            echo "Push rechazado (intento $intento)."
          done
          exit 1

      # Lee lo que quedó en data-store; no escribe nada.
      - name: Concordancia diaria D1
        run: python tools/concordancia_d1.py

      - name: Resultado
        if: steps.velas.outcome == 'failure'
        run: |
          echo "La ingesta falló o quedó incompleta (ver el paso 'Velas diarias de D1'). Lo válido quedó commiteado."
          exit 1
