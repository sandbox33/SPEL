name: SPEL — Sync & Validate Data

on:
  # Un click manual desde GitHub Actions tab
  workflow_dispatch:
    inputs:
      activos:
        description: 'Activos a procesar (separados por coma)'
        required: false
        default: 'NVDA,BTC,XAU,NIFTY50'
      run_audit:
        description: 'Ejecutar DNA audit después del sync'
        required: false
        default: 'true'
        type: boolean

  # Automático cada día a las 6:00 AM UTC (mercados abriendo)
  schedule:
    - cron: '0 6 * * 1-5'   # lunes a viernes

env:
  SPEL_ROOT: ./spel_data
  PYTHON_VERSION: '3.11'

jobs:
  # ─── JOB 1: Verificar integridad de datos ────────────────────
  integrity_check:
    name: SHA Integrity Check
    runs-on: ubuntu-latest
    outputs:
      sha_ok: ${{ steps.sha_check.outputs.sha_ok }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install polars pyarrow numpy --quiet

      - name: SHA integrity check
        id: sha_check
        run: |
          python -c "
          import hashlib, json, sys
          from pathlib import Path

          SHA_ESPERADOS = {
              'NVDA':    '3627a749da49',
              'BTC':     'a2c4e6f6e816',
              'XAU':     'a8e10cff2e80',
              'NIFTY50': '5e9624595c03',
          }

          all_ok = True
          for activo, esperado in SHA_ESPERADOS.items():
              p = Path('spel_data/ohlcv') / f'{activo}_ohlcv_v4.parquet'
              if not p.exists():
                  print(f'SKIP {activo}: archivo no encontrado (normal en CI)')
                  continue
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for chunk in iter(lambda: f.read(65536), b''):
                      h.update(chunk)
              real = h.hexdigest()[:12]
              ok = real == esperado
              print(f'{'OK' if ok else 'FAIL'} {activo}: {real}')
              if not ok:
                  all_ok = False

          print(f'sha_ok={str(all_ok).lower()}')
          " >> $GITHUB_OUTPUT

  # ─── JOB 2: Descargar OHLCV fresco ──────────────────────────
  sync_ohlcv:
    name: Sync OHLCV Data
    runs-on: ubuntu-latest
    needs: integrity_check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          pip install polars pyarrow yfinance pandas requests --quiet

      - name: Download OHLCV (Yahoo Finance)
        env:
          ACTIVOS: ${{ github.event.inputs.activos || 'NVDA,BTC,XAU,NIFTY50' }}
        run: |
          python spel_scripts/sync_ohlcv.py --activos "$ACTIVOS"

      - name: Upload OHLCV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ohlcv-fresh
          path: spel_data/ohlcv/
          retention-days: 7

  # ─── JOB 3: Descargar GDELT CSV más reciente ─────────────────
  sync_gdelt:
    name: Sync GDELT CSVs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install polars pyarrow requests pandas --quiet

      - name: Download last 7 days GDELT
        run: python spel_scripts/sync_gdelt.py --days 7

      - name: Upload GDELT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-fresh
          path: spel_data/gdelt_raw/
          retention-days: 7

  # ─── JOB 4: DNA Audit ────────────────────────────────────────
  dna_audit:
    name: DNA Audit
    runs-on: ubuntu-latest
    needs: [sync_ohlcv, sync_gdelt]
    if: ${{ github.event.inputs.run_audit != 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ohlcv-fresh
          path: spel_data/ohlcv/

      - name: Install deps
        run: pip install polars pyarrow numpy --quiet

      - name: Run DNA Audit
        run: python spel_dna_audit.py --ci-mode

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dna-audit-report
          path: spel_data/meta/dna_audit_report.json
          retention-days: 30

  # ─── JOB 5: Notificación resumen ─────────────────────────────
  notify:
    name: Summary
    runs-on: ubuntu-latest
    needs: [sync_ohlcv, sync_gdelt, dna_audit]
    if: always()

    steps:
      - name: Job Summary
        run: |
          echo "## SPEL Data Sync — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| OHLCV Sync | ${{ needs.sync_ohlcv.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GDELT Sync | ${{ needs.sync_gdelt.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DNA Audit  | ${{ needs.dna_audit.result }} |" >> $GITHUB_STEP_SUMMARY
