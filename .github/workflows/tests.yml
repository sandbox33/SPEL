# .github/workflows/tests.yml
# ============================
# Orchestrator stub (Decisión #13, confirmada en sesión anterior).
#
# Esto es REAL y funciona hoy: corre la suite completa en cada push a
# main y en cada PR -- CI genuino, no un placeholder.
#
# Es un "stub" en el sentido de que NO hace entrenamiento todavía. Los 3
# pasos de abajo (checkout, setup Python, instalar deps) son el andamiaje
# que reusa cualquier job de negocio.
#
# LA NOTA QUE ESTABA ACÁ YA NO APLICA, y se corrige en vez de borrarse
# porque el hueco que describía duró desde el patch 0011: decía que
# faltaba "cambiar el paso final por `python ingestion/run_gdelt.py` una
# vez que ese script exista". El script no existía, y este workflow
# nombrándolo es lo que hacía parecer que sí -- ese malentendido es lo
# que cerró la Incógnita #1 de ESTADO.md. Hoy el script existe y NO se
# corre desde acá: tiene su propio workflow (`.github/workflows/gdelt.yml`),
# porque este corre la suite en cada push y la ingesta no tiene por qué
# bajar GDELT en cada push.
#
# GitHub Actions, no Colab: Colab no tiene API pública para ejecución
# headless (confirmado en sesión anterior) -- por eso la automatización
# programada vive acá, y Colab queda para trabajo manual bajo demanda.

name: SPEL Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Separado a propósito, no fusionado en el paso de arriba: así el log
      # del CI muestra qué es runtime real y qué es solo para probar. El
      # motor NO necesita pyarrow (ver requirements-dev.txt); el auditor del
      # data lake sí, y sin esto sus tests se saltearían en silencio.
      - name: Instalar dependencias de desarrollo (solo para tests)
        run: pip install -r requirements-dev.txt

      - name: Correr suite completa
        run: python -m pytest tests/ -v

  # ── research/: NO BLOQUEA, y es a propósito ──────────────────────────────
  #
  # `research/` es código retirado del camino caliente el 16-sep-2026 (la
  # cadena gold_score y price_signals). Sigue siendo importable y corrible
  # porque su condición de reversión está escrita -- ver research/__init__.py.
  #
  # `continue-on-error: true` es la decisión: estos tests tienen que SER
  # VISIBLES si se rompen, sin poder frenar un merge del motor. Sacarlos del
  # CI por completo los volvería invisibles hasta el día que alguien los
  # corra a mano, que es como un retiro se convierte en un abandono.
  #
  # El job `test` de arriba corre `pytest tests/`, así que no los colecta:
  # esto no los corre dos veces.
  research:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr los tests de research/ (informativo, no bloquea)
        run: python -m pytest research/tests/ -v
