name: SPEL Daily Signal

on:
  schedule:
    - cron: "45 12 * * 1-5"
  workflow_dispatch:

jobs:

  update_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -q requests numpy
      - name: Update snapshot
        run: python scripts/spel_snapshot_updater.py
      - name: Commit snapshot
        run: |
          git config user.email "spel-bot@noreply.com"
          git config user.name "SPEL Bot"
          git add meta/forex_macro_snapshot.json
          git diff --staged --quiet || git commit -m "auto: snapshot $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  signal:
    needs: update_snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -q requests yfinance polars numpy scikit-learn
      - name: Signal
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/spel_forex_iq_runner.py
