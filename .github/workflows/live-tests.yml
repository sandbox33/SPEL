# .github/workflows/live-tests.yml
# =================================
# Los tests marcados `live` — los que tocan una API real y necesitan una
# credencial de verdad. Es la tercera mitad del hueco que ESTADO.md
# registró el 18 ago: nada instanciaba adapters, nada llamaba a
# load_secret(), y ningún workflow inyectaba secretos. Las dos primeras las
# cierra ingestion/sources.py; esta es la tercera.
#
# POR QUÉ ESTÁ SEPARADO DE tests.yml, y no es un job más ahí adentro:
# tests.yml corre en `pull_request`, y un PR desde un FORK ejecuta el
# workflow del fork con permisos del fork. Si los secretos estuvieran
# declarados en ese workflow, bastaría con abrir un PR que cambie un paso
# por `echo "$TWELVEDATA_API_KEY"` para exfiltrarlos. GitHub mitiga esto
# no pasando secretos a PRs de forks, pero la mitigación es una política
# del proveedor, no una propiedad de este repo — y el día que alguien
# agregue `pull_request_target` "para que funcione", la mitigación
# desaparece sin que nadie lo note. Mantener los secretos en un archivo
# que NO se dispara por PR hace que ese error requiera editar este archivo
# a propósito, en vez de ser un efecto colateral.
#
# tests.yml se queda sin credenciales, y así debe seguir: corre la suite
# completa, y los tests `live` se saltean solos ahí por su propio skipif.
# Un skip visible en el log es la señal de que el hueco sigue abierto.

name: SPEL Live Tests

on:
  # Manual, a propósito. Cada corrida consume cuota real del plan gratuito
  # de los proveedores, así que se dispara cuando alguien quiere la
  # respuesta, no en cada push.
  #
  # `objetivo` elige UN job: `sondas` (los tests `live` de siempre) u
  # `orden_demo` (la parte B del brief del Admin del 06-oct-2026 (3): la
  # primera orden en la cuenta demo). Nunca los dos en la misma corrida,
  # así una sonda no puede disparar una orden ni al revés.
  workflow_dispatch:
    inputs:
      objetivo:
        description: "sondas (tests live) u orden_demo (parte B, 07..16-oct-2026)"
        type: choice
        options:
          - sondas
          - orden_demo
        default: sondas

  # Semanal, cuando haya un motivo para gastar cuota sin que nadie lo pida.
  # Comentado y no borrado porque la decisión ya está pensada y el día que
  # se active no hay que volver a razonarla: lo que este schedule detecta
  # es que un proveedor cambie la forma de su respuesta sin avisar, que es
  # un fallo que ningún test offline puede ver. Antes de descomentarlo hay
  # que confirmar que la cuota semanal alcanza para el conjunto completo de
  # tests live, que hoy es 2 y va a crecer.
  # schedule:
  #   - cron: "0 6 * * 1"   # lunes 06:00 UTC

jobs:
  live:
    if: inputs.objetivo != 'orden_demo'
    runs-on: ubuntu-latest

    # A nivel de JOB, no de step: los tests live son varios y van a ser más,
    # y repetir el bloque en cada step es la forma segura de que a uno se le
    # olvide. Nunca como argumento de comando (`pytest --key=...`): los
    # argumentos aparecen completos en el log del runner y en la lista de
    # procesos; una variable de entorno no.
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      # El App ID de la app PAT "SPEL TRADER" (registrada por el Admin el
      # 01-oct; decision-log 2026-10-01). La sonda de la legacy lo pone en
      # la URL; la sonda §0.A-3b lo manda en el header Deriv-App-ID, que el
      # OpenAPI oficial exige en /accounts y en /otp. No autoriza ninguna
      # cuenta por sí solo. El informe lo enmascara.
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      # La sonda §0.A-3b lo mandaba como Bearer a GET /accounts y a dos POST
      # de OTP (demo y real). Su entrada `live` del canal real se retiró el
      # 07-oct: la autorización era de un solo uso y se usó el 06-oct. Hoy
      # ningún test de este job pide un OTP real ni compra. El informe no lo
      # incluye: el test falla si aparece.
      DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
      # Le dice al guardián de tests/test_sources.py que en ESTE entorno la
      # ausencia de credenciales no es lo esperado, sino una falla de
      # plomería. Sin esto el guardián se saltea y un secreto mal escrito
      # en el bloque de arriba pasaría desapercibido: todos los tests live
      # se saltearían por su propio skipif y el workflow terminaría verde
      # sin haber probado nada.
      SPEL_EXPECT_SECRETS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar dependencias de desarrollo (solo para tests)
        run: pip install -r requirements-dev.txt

      # -m live selecciona exactamente los tests marcados. El marker está
      # registrado en pytest.ini justamente para que un typo
      # (`@pytest.mark.liv`) no deje un test fuera de esta selección en
      # silencio.
      - name: Correr solo los tests live
        run: python -m pytest tests/ -m live -v

  # La parte B del brief del Admin del 06-oct-2026 (3): UNA orden demo
  # (frxXAUUSD, MULTUP, stake mínimo, ×100, stop_loss 0,10 USD, sell a los
  # 60 s), solo entre el 07 y el 16-oct-2026 23:59 UTC; fuera de esa ventana
  # el test se salta solo. Si statement ya registra una compra en la ventana,
  # no compra. Lo dispara el Admin, nadie más.
  orden_demo:
    if: inputs.objetivo == 'orden_demo'
    runs-on: ubuntu-latest
    # Dos despachos seguidos no corren en paralelo: el segundo espera y, al
    # ver la compra del primero en statement, no compra.
    concurrency:
      group: orden-demo
      cancel-in-progress: false
    timeout-minutes: 20

    # Solo lo que la orden usa. SPEL_ORDEN_DEMO es el permiso que el test
    # exige; no es un secreto, y no está en el job de sondas.
    env:
      DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
      DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
      SPEL_ORDEN_DEMO: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar dependencias de desarrollo (solo para tests)
        run: pip install -r requirements-dev.txt

      - name: Parte B, primera orden demo
        run: python -m pytest tests/test_integracion_demo_orden_live.py -m live -v
