name: SPEL Autonomous Patrol

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: spel-patrol
  cancel-in-progress: true

permissions:
  contents: write
  actions:  write

env:
  PYTHON_VER: "3.10"
  SPEL_ROOT:  "."
  PYTHONPATH: "."

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 13

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Restore telemetry from previous run ─────────────────────────
      # github-token required: searches COMPLETED runs, not current run.
      # Without it: always looks at current run (empty) → DATA_STALE.
      - name: Download prev telemetry artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name:         spel-telemetry
          path:         00_VAULT/
          github-token: ${{ github.token }}

      # ── 3. Python environment ──────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install dependencies
        run: pip install numpy pandas polars yfinance requests --quiet

      # ── 4. J0: DMS stale check + status snapshot ───────────────────────
      - name: J0 Auth Gate + DMS check
        run: |
          python 01_HOLMES_OPS/spel_dead_man_switch.py --check || true
          python 04_GOLD_MODULES/spel_orchestrator_v10.py --status
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_SISTEMA:  ${{ secrets.TELEGRAM_SISTEMA }}
          TELEGRAM_SENALES:  ${{ secrets.TELEGRAM_SENALES }}
          TELEGRAM_BACKUP:   ${{ secrets.TELEGRAM_BACKUP }}
          TELEGRAM_CHAOS:    ${{ secrets.TELEGRAM_CHAOS }}
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SPEL_BASE_DIR:     "."

      # ── 5. J1-J4: Main patrol cycle ────────────────────────────────────
      - name: J1-J4 Main patrol cycle
        run: python 04_GOLD_MODULES/spel_orchestrator_v10.py
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_SISTEMA:  ${{ secrets.TELEGRAM_SISTEMA }}
          TELEGRAM_SENALES:  ${{ secrets.TELEGRAM_SENALES }}
          TELEGRAM_BACKUP:   ${{ secrets.TELEGRAM_BACKUP }}
          TELEGRAM_CHAOS:    ${{ secrets.TELEGRAM_CHAOS }}
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SPEL_BASE_DIR:     "."

      # ── 6. DMS pulse: write COMPLETE (always — even on degraded cycle) ──
      - name: Update pulse (DMS)
        if: always()
        run: python 01_HOLMES_OPS/spel_dead_man_switch.py --pulse
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAOS: ${{ secrets.TELEGRAM_CHAOS }}
          SPEL_BASE_DIR:  "."

      # ── 7. Upload ephemeral telemetry artifacts (1-run TTL bridge) ──────
      - name: Upload telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:              spel-telemetry
          path: |
            00_VAULT/live_bma_result.json
            00_VAULT/system_pulse.json
            00_VAULT/live_dashboard_stats.json
            00_VAULT/live_forex_signal.json
            00_VAULT/live_bma_history.json
            00_VAULT/last_signal.json
          retention-days:    2
          overwrite:         true
          if-no-files-found: warn

      # ── 8. Commit persistent state to Git ─────────────────────────────
      # FIX DATA-01: last_signal.json committed here so it survives
      # cold starts (artifact expiry, first run, etc.).
      # vitality_tesla=0 (DATA_STALE) was caused by last_signal.json
      # never being persisted to git. This commit is the fix.
      #
      # FIX CI-01: stash unstaged changes before rebase to avoid the
      # "cannot pull with rebase: You have unstaged changes" log error.
      - name: Commit persistent state to Git
        if: success()
        run: |
          git config user.name  "SPEL Holmes"
          git config user.email "holmes@spel.ai"

          # Stage all persistent state files that exist
          [ -f 00_VAULT/gate_metrics.json ]          && git add 00_VAULT/gate_metrics.json
          [ -f 00_VAULT/registry/SHA_REGISTRY.json ] && git add 00_VAULT/registry/SHA_REGISTRY.json
          [ -f 00_VAULT/last_signal.json ]            && git add 00_VAULT/last_signal.json
          [ -f 00_VAULT/live_graph_data.json ]        && git add 00_VAULT/live_graph_data.json

          # Only commit + push if there are staged changes
          git diff --staged --quiet || {
            git commit -m "chore(patrol): state snapshot [$(date -u +%H%M)] [skip ci]"
            # FIX CI-01: stash any unstaged runner artifacts before rebase
            git stash --include-untracked --quiet 2>/dev/null || true
            git pull --rebase origin main --quiet || true
            git stash pop --quiet 2>/dev/null || true
            git push origin main
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
