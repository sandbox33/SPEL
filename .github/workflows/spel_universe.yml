name: SPEL Autonomous Patrol
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# RACE CONDITION FIX: un solo ciclo activo a la vez
concurrency:
  group: spel-patrol
  cancel-in-progress: true

permissions:
  contents: write        # para git commit de gate_metrics.json
  actions: write         # para upload-artifact

env:
  PYTHON_VER: "3.10"
  SPEL_ROOT:  "."        # GH Actions: ROOT = GITHUB_WORKSPACE = repo root

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 13  # Hard kill si el ciclo supera 13min (antes del próximo cron)

    steps:
      # ── Download previous telemetry (Artifacts) ────────────────────────
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Download prev telemetry artifacts
        uses: actions/download-artifact@v4
        with:
          name: spel-telemetry
          path: 00_VAULT/
        continue-on-error: true  # Primer ciclo: no hay artifact previo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Install deps
        run: pip install numpy yfinance requests --quiet

      # ── J0: Auth Gate + Dead Man's Switch check ────────────────────────
      - name: J0 Auth Gate + DMS check
        run: |
          python 01_HOLMES_OPS/spel_dead_man_switch.py --check || true
          python 04_GOLD_MODULES/spel_orchestrator_v10.py --status
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TG_TOKEN }}
          TELEGRAM_SISTEMA: ${{ secrets.TG_SISTEMA }}
          TELEGRAM_CHAOS:   ${{ secrets.TG_CHAOS }}
          GITHUB_TOKEN:     ${{ secrets.GH_TOKEN }}
          ALPACA_API_KEY:   ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      # ── J1-J4: Ciclo principal ─────────────────────────────────────────
      - name: J1-J4 Main patrol cycle
        run: python 04_GOLD_MODULES/spel_orchestrator_v10.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TG_TOKEN }}
          TELEGRAM_SISTEMA: ${{ secrets.TG_SISTEMA }}
          TELEGRAM_CHAOS:   ${{ secrets.TG_CHAOS }}
          GITHUB_TOKEN:     ${{ secrets.GH_TOKEN }}
          ALPACA_API_KEY:   ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SPEL_BASE_DIR:    "."  # GH Actions: ROOT = repo root

      # ── Dead Man's Switch: actualizar pulso ────────────────────────────
      - name: Update pulse (DMS)
        if: success()
        run: python 01_HOLMES_OPS/spel_dead_man_switch.py --pulse
        env:
          TELEGRAM_TOKEN: ${{ secrets.TG_TOKEN }}
          SPEL_BASE_DIR:  "."

      # ── Upload TELEMETRY como Artifact (NO commits) ────────────────────
      - name: Upload telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spel-telemetry
          path: |
            00_VAULT/live_bma_result.json
            00_VAULT/system_pulse.json
            00_VAULT/live_dashboard_stats.json
            00_VAULT/live_forex_signal.json
            00_VAULT/live_bma_history.json
            00_VAULT/last_signal.json
          retention-days: 1
          overwrite: true

      # ── Commit SOLO datos permanentes (no telemetry) ───────────────────
      - name: Commit gate_metrics + SHA_REGISTRY
        if: success()
        run: |
          git config user.name  "SPEL Holmes"
          git config user.email "holmes@spel.ai"
          git add 00_VAULT/gate_metrics.json
          git add 00_VAULT/registry/SHA_REGISTRY.json
          git diff --staged --quiet || git commit -m "chore(patrol): gate_metrics + SHA [$(date -u +%H%M)]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
