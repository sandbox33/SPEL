# .github/workflows/velas_intradia.yml
# ====================================
# Velas M5 del oro de TwelveData y de Deriv, y la concordancia de su rango
# de apertura (brief del Admin del 06-oct-2026 (4), puntos 1c y 4).
#
# SOLO MANUAL: lo dispara el Admin. Sin `schedule:`: la primera corrida baja
# la historia entera de TwelveData desde 2020 (unas 95 páginas, a 7 por
# minuto), y no tiene sentido repetirla sola.
#
# Escribe en la rama `data` con el patrón de velas.yml: checkout de `data`
# en ./data-store, SPEL_DRIVE_ROOT apuntando ahí, commit solo si hay
# cambios. COMPARTE EL GRUPO DE CONCURRENCY con gdelt.yml, velas.yml y
# sonda.yml: todos escriben en `data`. Uno a la vez, sin cancelar.
#
# El canal de Deriv es el PÚBLICO nuevo (/ws/public): no lleva cuenta, ni
# token, ni App ID. El único secreto es la key de TwelveData.

name: SPEL velas intradía del oro

on:
  workflow_dispatch: {}

concurrency:
  group: gdelt-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  velas_intradia:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SPEL_DRIVE_ROOT: ${{ github.workspace }}/data-store
    steps:
      - uses: actions/checkout@v4

      - name: Checkout de la rama data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-store
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # La key entra por `env:` de ESTE paso y nunca como argumento.
      # `continue-on-error`: una descarga incompleta o una vela inválida
      # sale 1 DESPUÉS de escribir lo válido; se commitea y el job se pone
      # rojo al final.
      - name: Velas M5 del oro (escribe en data-store)
        id: velas
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python ingestion/velas_intradia.py --write

      - name: Commit a data
        working-directory: data-store
        run: |
          git add -A metrics/velas metrics/calendario
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "velas M5 del oro $(date -u +%F)" \
            -m "Corrida ${{ github.run_id }} de ${{ github.workflow }} (${{ github.event_name }})."
          for intento in 1 2; do
            git pull --rebase -q origin data && git push -q origin HEAD:data && exit 0
            echo "Push rechazado (intento $intento)."
          done
          exit 1

      # Lee lo que quedó en data-store; no escribe nada.
      - name: Concordancia del rango de apertura
        run: python tools/concordancia_xauusd.py

      - name: Resultado
        if: steps.velas.outcome == 'failure'
        run: |
          echo "La ingesta falló o quedó incompleta (ver el paso 'Velas M5 del oro'). Lo válido quedó commiteado."
          exit 1
