# .github/workflows/gdelt.yml
# ============================
# Ingesta GDELT diaria. ESTE WORKFLOW ES EL ESCRITOR ÚNICO DE LA SERIE desde
# el 21-sep-2026 (decision-log.md, enmienda a la Decisión #14). Drive dejó de
# escribir, y ningún notebook vuelve a correr `run_gdelt --write`.
#
# Hasta ese día este archivo decía "ESTE WORKFLOW NUNCA ESCRIBE", y el motivo
# era correcto: `append_day()` es append puro y `read_series()` deduplica por
# día, y ese par tolera duplicados pero NO divergencia. Con dos escritores
# quedan dos series con días distintos y nada que las reconcilie. El motivo
# sigue en pie; lo que cambió es cuál de los dos escritores se eliminó.
#
# ══ DÓNDE ESCRIBE ══
#
# En la rama huérfana `data`, nunca en main. Hay dos checkouts: el código
# (la rama que disparó el workflow; en el cron, la default) y `data` en
# ./data-store. `SPEL_DRIVE_ROOT` apunta a ./data-store, y `drive_root()` lo
# resuelve primero -- así `append_day()` y `read_series()` escriben y leen
# ahí sin una línea de código nueva. Ver el README de la rama `data`.
#
# ══ SIN RECURSIÓN ══
#
# Los pushes hechos con GITHUB_TOKEN NO disparan workflows: es una regla de
# GitHub, no de este archivo. Y aunque la regla cambiara, tests.yml solo
# escucha `main` y este archivo no tiene trigger de push. Un commit en
# `data` no corre nada.
#
# ══ LA ORDEN DE ARRANQUE ══
#
# El cron queda activo al fusionar. Si dispara antes de que la siembra de
# BTC y XAU esté subida a `data`, `--exigir-serie BTC XAU` hace que salga
# verde sin bajar ni escribir nada. Sin eso, arrancaría esas dos series por
# los últimos 10 días y fijaría la marca de inicio ahí, con la siembra
# llegando después por debajo. Secuencia prevista: fusionar, sembrar,
# `modo: verificar_siembra`, `modo: ingesta`, y el cron sigue solo.
#
# ══ `--since` ══
#
# El cron NUNCA lo pasa. Un dispatch puede, y con escritura REESCRIBE los
# días que ya estaban: `read_series()` se queda con la última fila. El
# script lo avisa en el log.
#
# ══ LÍMITE CONOCIDO ══
#
# GitHub desactiva los `schedule:` de un repo sin actividad durante ~60 días,
# y los commits del bot a `data` pueden no contar como actividad. Ver
# decision-log.md: la mitigación es la actividad de PRs en main y el
# `dias_de_retraso` que reporta la alarma.

name: SPEL GDELT

on:
  # Diario: GDELT publica UN archivo por día. 06:30 UTC, y si a esa hora
  # todavía no publicó el de ayer, el día se escribe vacío y la corrida de
  # mañana lo reintenta (ver ingestion/run_gdelt.py, reconciliación).
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "ingesta: baja y escribe en `data`. verificar_siembra: compara BTC/XAU sembrados contra la serie medida, sin escribir."
        type: choice
        options: [ingesta, verificar_siembra]
        default: ingesta
      max_days:
        description: "Días por corrida. Vacío = DEFAULT_MAX_DAYS de ingestion/run_gdelt.py"
        required: false
        default: ""
      since:
        description: "Fecha ISO desde la cual bajar. REESCRIBE los días existentes (gana la última fila). El cron nunca lo usa."
        required: false
        default: ""

# Una sola corrida a la vez sobre `data`, y SIN cancelar la que está en
# curso: cancelarla a mitad de un push dejaría días escritos en el runner y
# no en la rama. La que llega espera.
concurrency:
  group: gdelt-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingesta:
    if: github.event_name == 'schedule' || inputs.modo == 'ingesta'
    runs-on: ubuntu-latest
    # El único job con escritura. La verificación no la necesita.
    permissions:
      contents: write
    env:
      SPEL_DRIVE_ROOT: ${{ github.workspace }}/data-store
    steps:
      - uses: actions/checkout@v4

      - name: Checkout de la rama data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-store
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Los inputs entran por `env:`, NO interpolados dentro del `run:`. Un
      # `${{ inputs.x }}` pegado en la línea de comando se expande ANTES de
      # que exista un shell, así que un input con `;` o backticks ejecuta lo
      # que quiera. Pasarlos como variables de entorno los deja como datos.
      #
      # `continue-on-error`: si la cadena se rompe a mitad de corrida, los
      # días ya escritos se commitean igual (la ingesta es reanudable) y el
      # job se pone rojo al final, en "Resultado".
      - name: Ingesta GDELT (escribe en data-store)
        id: ingesta
        continue-on-error: true
        env:
          MAX_DAYS: ${{ inputs.max_days }}
          SINCE: ${{ inputs.since }}
        run: |
          args=(--write --exigir-serie BTC XAU)
          if [ -n "$MAX_DAYS" ]; then args+=(--max-days "$MAX_DAYS"); fi
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          python ingestion/run_gdelt.py "${args[@]}"

      # Commit SOLO si hay cambios. El mensaje lleva cuántos días sumó cada
      # activo (una línea por día escrito, incluidos los reintentos que se
      # curaron). Se cuentan agregadas MENOS borradas: si la siembra llegó sin
      # salto final, append_day() se lo agrega y git ve la última línea
      # sembrada como borrada y vuelta a agregar -- sin la resta, el primer
      # commit diría un día de más. `pull --rebase` antes del push, con un reintento: la
      # concurrencia ya serializa las corridas, y lo único que puede meterse
      # en el medio es un commit a mano en `data`.
      - name: Commit a data
        working-directory: data-store
        run: |
          git add -A metrics
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay nada que commitear."
            exit 0
          fi
          resumen=$(git diff --cached --numstat -- metrics/gdelt_series \
            | awk '{n=$3; sub(".*/", "", n); sub("\\.jsonl$", "", n); printf "%s +%s, ", n, $1 - $2}' \
            | sed 's/, $//')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ingesta GDELT $(date -u +%F): ${resumen:-solo la marca de inicio}" \
            -m "Corrida ${{ github.run_id }} de ${{ github.workflow }} (${{ github.event_name }})."
          for intento in 1 2; do
            git pull --rebase -q origin data && git push -q origin HEAD:data && exit 0
            echo "Push rechazado (intento $intento)."
          done
          exit 1

      # Después del commit, a propósito: una alarma roja no puede impedir que
      # se guarden los días que sí se bajaron.
      - name: Alarma de frescura
        run: python ingestion/frescura.py

      - name: Resultado de la ingesta
        if: steps.ingesta.outcome == 'failure'
        run: |
          echo "La cadena de ingesta se rompió (ver el paso 'Ingesta GDELT'). Lo que se alcanzó a escribir quedó commiteado."
          exit 1

  verificar_siembra:
    if: github.event_name == 'workflow_dispatch' && inputs.modo == 'verificar_siembra'
    runs-on: ubuntu-latest
    env:
      SPEL_DRIVE_ROOT: ${{ github.workspace }}/data-store
    steps:
      - uses: actions/checkout@v4

      - name: Checkout de la rama data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-store

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar la siembra (read-only)
        run: python tools/verificar_siembra.py
