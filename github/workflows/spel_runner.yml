name: SPEL v40 — Paper Adapter + Dashboard Data

# ⚠️  NOTA DE CAPACIDAD:
# Cron cada 15min en horario de mercado (13:00-17:00 UTC L-V) = ~80 runs/sem
# GitHub Actions free: 2,000 min/mes. Cada run ≈ 3min → ~240 min/sem.
# Dentro del límite. NO usar cron cada 60min (720 runs = 2,160 min/mes → throttle).
#
# Para mayor frecuencia: usar self-hosted runner (Railway/Render) o
# activar el loop interno de spel_paper_adapter_v2.py desde Colab.

on:
  schedule:
    # ── Snapshot GDELT + señal forex: 07:45 ECT (12:45 UTC) L-V ──
    - cron: "45 12 * * 1-5"

    # ── Paper trading evaluations: cada 15min en ventana 13:00-17:00 UTC L-V ──
    - cron: "0,15,30,45 13,14,15,16 * * 1-5"

  # Disparo manual para debug
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: signal | paper | audit | all"
        required: false
        default: "all"
        type: choice
        options: ["signal", "paper", "audit", "all"]

env:
  PYTHON_VERSION: "3.11"
  SPEL_ROOT:      "."
  # R33: denominadores canónicos expuestos como env vars para el adapter
  CANONICAL_CAPITAL: "100000.0"
  SANDBOX_CAPITAL:   "10.0"

jobs:

  # ══════════════════════════════════════════════════════════════
  # JOB 1: update_snapshot (GDELT entropy por par forex)
  # Misma lógica que spel_daily.yml Job 1 — se ejecuta solo a 12:45 UTC
  # ══════════════════════════════════════════════════════════════
  update_snapshot:
    name: "GDELT Snapshot Update"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Solo corre en el cron de 12:45 UTC, no en los de 15min
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       contains('45', github.event.schedule) == false ||
       contains('12', github.event.schedule))

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps — snapshot only
        run: pip install -q requests numpy

      - name: Run snapshot updater
        env:
          SPEL_BASE_DIR: ${{ env.SPEL_ROOT }}
        run: python scripts/spel_snapshot_updater.py

      - name: Commit snapshot (R32 atomic)
        run: |
          git config user.email "spel-bot@noreply.github.com"
          git config user.name "SPEL Bot v40"
          git add meta/forex_macro_snapshot.json
          git diff --staged --quiet || \
            git commit -m "auto(R32): snapshot $(date -u +'%Y-%m-%dT%H:%M')UTC"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ══════════════════════════════════════════════════════════════
  # JOB 2: paper_signal — score engine + paper adapter
  # Corre en cada trigger de 15min (ventana 13:00-17:00 UTC)
  # ══════════════════════════════════════════════════════════════
  paper_signal:
    name: "Paper Signal + Trade Evaluation"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: []  # independiente de update_snapshot en los 15min runs

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout dashboard-data branch (para read history)
        run: |
          git fetch origin dashboard-data || true
          git checkout -b dashboard-data origin/dashboard-data 2>/dev/null || true
          git checkout main

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          pip install -q \
            polars numpy alpaca-py \
            requests yfinance

      - name: Verify SHAs pre-run (R3 + R31)
        run: |
          python - <<'EOF'
          import json, hashlib
          from pathlib import Path

          reg  = json.loads(Path("meta/SHA_REGISTRY.json").read_text())
          fail = []
          for asset, meta in reg.items():
              sha_exp = meta.get("sha_v5","")
              pq = Path(f"data_lake/{asset}/ohlcv/aggregated/{asset}_ohlcv_v5.parquet")
              if not pq.exists():
                  print(f"  SKIP {asset}: parquet not in repo (expected)")
                  continue
              sha_act = hashlib.sha256(pq.read_bytes()).hexdigest()[:12]
              ok = sha_act == sha_exp
              print(f"  {'✅' if ok else '🔴'} {asset}: {sha_act} vs {sha_exp}")
              if not ok:
                  fail.append(asset)
          if fail:
              raise SystemExit(f"EF-19: SHA mismatch {fail} — abort")
          EOF

      - name: Run paper adapter — one evaluation cycle
        env:
          ALPACA_KEY:        ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET:     ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_SENALES:  ${{ secrets.TELEGRAM_SENALES }}
          TELEGRAM_SISTEMA:  ${{ secrets.TELEGRAM_SISTEMA }}
          CANONICAL_CAPITAL: ${{ env.CANONICAL_CAPITAL }}
          SANDBOX_CAPITAL:   ${{ env.SANDBOX_CAPITAL }}
          SPEL_BASE_DIR:     ${{ env.SPEL_ROOT }}
        run: |
          python - <<'EOF'
          import os, sys, json
          from pathlib import Path

          # EF-20 guard — verificar env vars antes de instanciar
          canon = float(os.environ.get("CANONICAL_CAPITAL", "100000"))
          sand  = float(os.environ.get("SANDBOX_CAPITAL", "10"))
          if canon == sand:
              raise SystemExit("EF-20: CANONICAL_CAPITAL == SANDBOX_CAPITAL — abort")

          # Fail-fast credentials (EF-19)
          for k in ["ALPACA_KEY", "ALPACA_SECRET"]:
              if not os.environ.get(k):
                  raise SystemExit(f"EF-19: missing secret {k} — abort")

          sys.path.insert(0, "scripts")
          from spel_paper_adapter_v2 import SPELPaperAdapterV2
          from spel_score_engine import score as score_fn

          root    = Path(os.environ.get("SPEL_BASE_DIR", "."))
          adapter = SPELPaperAdapterV2(
              root       = root,
              api_key    = os.environ["ALPACA_KEY"],
              api_secret = os.environ["ALPACA_SECRET"],
              score_fn   = score_fn,
          )
          records = adapter.evaluate_once()
          print(f"Evaluated {len(records)} assets")

          # Graceful shutdown — fix vault.stop()
          adapter.stop(timeout=5.0)
          EOF

      - name: Commit execution summary to dashboard-data
        run: |
          SUMMARY="meta/spel_v40_execution_summary.json"
          GATE="logs/gate_metrics.json"
          TRADES="logs/trade_log.csv"

          git config user.email "spel-bot@noreply.github.com"
          git config user.name "SPEL Bot v40"

          # Cambiar a rama dashboard-data (crear si no existe)
          git fetch origin dashboard-data 2>/dev/null || true
          git checkout dashboard-data 2>/dev/null || \
            git checkout --orphan dashboard-data

          # Copiar artefactos desde el workspace
          cp -f "$SUMMARY" . 2>/dev/null || true
          cp -f "$GATE"    . 2>/dev/null || true
          cp -f "$TRADES"  . 2>/dev/null || true

          git add \
            spel_v40_execution_summary.json \
            gate_metrics.json \
            trade_log.csv 2>/dev/null || true

          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M')
          git diff --staged --quiet || \
            git commit -m "data(R33): execution summary ${TIMESTAMP}UTC"

          git push origin dashboard-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ══════════════════════════════════════════════════════════════
  # JOB 3: healthcheck (if: always — dead-man switch)
  # R32: verifica que el signal job emitió last_signal.json
  # ══════════════════════════════════════════════════════════════
  healthcheck:
    name: "Dead-man Switch"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: paper_signal
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dashboard-data

      - name: Verify signal sentinel
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_SISTEMA: ${{ secrets.TELEGRAM_SISTEMA }}
        run: |
          python - <<'PYEOF'
          import os, json, datetime, urllib.request, pathlib

          sentinel = pathlib.Path("spel_v40_execution_summary.json")
          token    = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id  = os.environ.get("TELEGRAM_SISTEMA", "")

          if not sentinel.exists():
              msg = (
                  "🔴 PIPELINE ALERT — SPEL v40\n"
                  "spel_v40_execution_summary.json missing\n"
                  f"Timestamp: {datetime.datetime.utcnow().isoformat()}\n"
                  "→ Check GitHub Actions paper_signal job"
              )
              if token and chat_id:
                  urllib.request.urlopen(
                      urllib.request.Request(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data=json.dumps({"chat_id": chat_id, "text": msg}).encode(),
                          headers={"Content-Type": "application/json"},
                      ),
                      timeout=10,
                  )
              print("ALERT SENT — sentinel missing")
          else:
              data    = json.loads(sentinel.read_text())
              updated = data.get("updated_utc", "?")
              day     = data.get("day_counter", "?")
              print(f"✅ Sentinel OK — Day {day}/63 | Updated: {updated}")
          PYEOF
          
