# ════════════════════════════════════════════════════════════════
# SPEL — Asset Universe v1.0
# Fuente de verdad para todos los activos del sistema.
# Cada activo define: fuente de datos, semántica de volumen,
# modos de trading aplicables, lookback SPEL y keywords GDELT.
#
# volume_type:
#   NATIVE_FUTURES    → volumen real de contratos (commodities)
#   SPOT_CRYPTO       → volumen spot real (crypto)
#   TICK_PROXY        → tick volume como proxy (forex)
#   SYNTHETIC_INDEX   → índice sin volumen nativo → 0.0 sentinel
#   YIELD_INSTRUMENT  → bono/yield → sin volumen operativo
#
# trading_modes: [scalp, intraday, swing, crisis_contra]
# priority: 1=core SPEL, 2=extended, 3=monitor-only
# ════════════════════════════════════════════════════════════════

