    name: "Livedoor Shock 2005"
    description: >
      Error de digitación en acciones de Livedoor (LDNET). BNF compró
      masivamente durante el caos. Ganó ¥2B en un día.
      En SPEL equivale a: vitality_tesla=9, entropy_shannon >> P90,
      crisis_contra activado, contra-trend CALL post-pánico.

# ────────────────────────────────────────────────────────────────
# TRADING MODES — Definición de modos y condiciones de activación
# ────────────────────────────────────────────────────────────────
trading_modes:

  scalp:
    description: "Operaciones rápidas 1m-15m, múltiples trades/día"
    godel_condition: "INACTIVE"         # Gödel OFF = mercado predecible
    vitality_range: [0, 3]              # paz o tensión baja
    entropy_condition: "below_p50"
    nash_frozen_condition: "high"       # compresión → ruptura inminente
    applicable_assets: ["EURUSD", "GBPUSD", "USDJPY", "BTC", "ETH", "WTI"]
    timeframes: ["1m", "5m", "15m"]
    stop_loss_atr_mult: 1.0
    loss_weight: 0.5                    # vitality=0→3, W=0.5
    notes: "Solo en sesiones líquidas. Stops estrechos. Máx 3-5 trades/día."

  intraday:
    description: "Operaciones en el día, no pernoctar posición"
    godel_condition: "ACTIVATING"       # Gödel entrando
    vitality_range: [3, 6]
    entropy_condition: "p50_to_p90"
    applicable_assets: ["SPX", "NDX", "DAX", "XAU", "WTI", "BRENT", "EURUSD", "BTC", "NVDA"]
    timeframes: ["15m", "30m", "1h", "4h"]
    stop_loss_atr_mult: 1.5
    loss_weight: 1.0                    # vitality=6, W=1.0
    notes: "Cerrar posiciones antes del cierre de sesión. Usar entropy_decay_lambda."

  swing:
    description: "Posiciones multiday 2-15 días"
    godel_condition: "ACTIVE"           # Gödel encendido
    vitality_range: [6, 9]
    entropy_condition: "above_p90"
    applicable_assets: ["SPX", "XAU", "NDX", "DAX", "NIFTY50", "NKY", "BTC", "ETH", "HG", "US10Y"]
    timeframes: ["4h", "1D", "1W"]
    stop_loss_atr_mult: 2.5
    loss_weight: 2.0                    # vitality=9, W=2.0
    notes: "Score de Oro completo. Kelly sizing. Walk-forward validation antes de live."

  crisis_contra:
    description: "Contra-tendencia post-pánico — XAU Régimen 2"
    godel_condition: "POST_ACTIVE"      # Gödel fue activo, ahora decrece
    vitality_condition: "was_9_now_falling"
    entropy_condition: "peaked_descending"
    applicable_assets: ["XAU", "SPX", "USDCHF", "USDJPY"]
    timeframes: ["1D", "1W"]
    stop_loss_atr_mult: 3.0
    loss_weight: 2.0
    notes: >
      Señal más potente del sistema. El pánico ya fue descontado.
      XAU validado: 52.1% edge post-Gödel (1001 días).
      BNF Kotegawa usaba esto: comprar cuando todos venden en pánico.

