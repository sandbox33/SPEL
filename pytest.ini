[pytest]
; asyncio_mode = auto: varios tests en tests/test_adapters.py son
; `async def` (DerivAdapter.fetch_ohlcv es async por diseño -- ver
; ingestion/adapters.py). Sin este modo, pytest-asyncio exige un
; @pytest.mark.asyncio explícito en cada test async, y sin la config
; misma, un clon limpio del repo falla la suite con un error de
; "async def functions are not natively supported" en vez de una
; pista clara sobre qué falta instalar/configurar.
asyncio_mode = auto

; El motivo real de registrar `live` NO es callar el
; PytestUnknownMarkWarning -- es que sin registrar, un marker mal escrito
; (`@pytest.mark.liv`, `@pytest.mark.Live`) no falla: pytest lo acepta en
; silencio, y el test queda con un marker que ningún `-m` selecciona nunca.
; Un test que toca la red real y que nadie vuelve a correr por un typo es
; peor que no tenerlo, porque figura como cobertura existente.
;
; NO se excluye por defecto (nada de `addopts = -m "not live"`): cada test
; live lleva su propio skipif sobre la credencial que necesita, así que en
; un entorno sin claves se saltea solo, y en uno con claves corre -- que es
; exactamente cuando se quiere que corra. Excluirlo por defecto además
; escondería el skip, que es la señal visible de que el hueco sigue abierto.
markers =
    live: toca la red y una API real; requiere la credencial del proveedor
